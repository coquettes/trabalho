
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Matérias</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(120deg, #e0f7fa, #e1bee7);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      flex: 1;
    }

    h1 {
      text-align: center;
      color: #4a148c;
      margin-bottom: 30px;
    }

    .dropdown {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .dropdown > button {
      background-color: #7b1fa2;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .dropdown > button:hover {
      background-color: #6a1b9a;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
      min-width: 180px;
    }

    .dropdown-content button {
      background: none;
      border: none;
      padding: 12px 16px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      color: #4a148c;
    }

    .dropdown-content button:hover {
      background-color: #f3e5f5;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    #searchBox {
      width: 100%;
      padding: 10px;
      margin: 20px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #conteudo {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-top: 20px;
    }

    h2 {
      color: #6a1b9a;
      margin-bottom: 20px;
    }

    h3 {
      color: #7b1fa2;
      margin-top: 20px;
    }

    p {
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #7b1fa2;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Colégio: Colégio Estadual do P</h1>

    <div class="dropdown">
      <button>Matérias</button>
      <div class="dropdown-content">
        <button onclick="mostrarConteudo('fisica')">Física</button>
        <button onclick="mostrarConteudo('quimica')">Química</button>
        <button onclick="mostrarConteudo('matematica')">Matemática</button>
      </div>
    </div>

    <input type="text" id="searchBox" placeholder="Pesquisar nos conteúdos..." oninput="filtrarTexto()">

    <div id="conteudo"></div>
  </div>

  <footer>
    Ana Cecília e Jon
  </footer>

  <script>
    const conteudos = {
      fisica: `
        <h2>Conteúdos de Física</h2>
        <h3>Eletromagnetismo</h3>
        <p>Estuda os fenômenos elétricos e magnéticos, como corrente elétrica, circuitos, resistores, campos magnéticos e geração de energia elétrica.</p>
        <h3>Óptica</h3>
        <p>Analisa os fenômenos relacionados à luz, como reflexão, refração, espelhos e lentes.</p>
        <h3>Ondulatória</h3>
        <p>Trata do comportamento das ondas — sonoras, luminosas e eletromagnéticas.</p>
        <h3>Física Moderna</h3>
        <p>Inclui conceitos como teoria da relatividade, física quântica e radioatividade.</p>
      `,
      quimica: `
        <h2>Conteúdos de Química</h2>
        <h3>Química Geral</h3>
        <p>Estuda as propriedades da matéria, transformações químicas e leis ponderais.</p>
        <h3>Físico-Química</h3>
        <p>Relaciona conceitos da física com a química, como cálculos estequiométricos, leis dos gases, termoquímica e equilíbrio químico.</p>
        <h3>Química Orgânica</h3>
        <p>Estuda compostos à base de carbono, como funções orgânicas e biomoléculas.</p>
        <h3>Química Ambiental</h3>
        <p>Inclui temas como chuva ácida, poluição e tratamento de resíduos químicos.</p>
      `,
      matematica: `
        <h2>Conteúdos de Matemática</h2>
        <h3>Álgebra</h3>
        <p>Estudo de expressões algébricas, equações, inequações e sistemas lineares.</p>
        <h3>Geometria</h3>
        <p>Explora formas, ângulos, área, volume e teoremas como o de Pitágoras.</p>
        <h3>Funções</h3>
        <p>Funções do 1º e 2º grau, exponencial, logarítmica e modular.</p>
        <h3>Estatística e Probabilidade</h3>
        <p>Trata da análise de dados, gráficos, média, mediana, moda e probabilidade.</p>
      `
    };

    let conteudoAtual = "";

    function mostrarConteudo(materia) {
      conteudoAtual = conteudos[materia];
      document.getElementById('conteudo').innerHTML = conteudoAtual;
      document.getElementById('searchBox').value = '';
    }

    function filtrarTexto() {
      const termo = document.getElementById('searchBox').value.toLowerCase();
      const div = document.createElement("div");
      div.innerHTML = conteudoAtual;
      if (!termo) {
        document.getElementById('conteudo').innerHTML = conteudoAtual;
        return;
      }

      const elementos = div.querySelectorAll("h3, p");
      elementos.forEach(el => {
        if (!el.textContent.toLowerCase().includes(termo)) {
          el.style.display = "none";
        } else {
          el.style.display = "";
        }
      });

      document.getElementById('conteudo').innerHTML = div.innerHTML;
    }
  </script>

</body>
</html>
